name: Lighthouse weekly cron

# Runs against production every Monday 06:00 IST = 00:30 UTC.
# Also manually triggerable for spot checks.
# Free GitHub Actions runner only — ₹0 ongoing.
#
# NOTE: assertions use `error`, not `warn`. A null score will NOT trip
# minScore (null is not a number), so a separate null-gate step is added
# below. Together these two checks guarantee the job goes red on either
# a low score OR a missing/null score.
#
# STEP ORDER — critical:
# 1. LHCI collect/assert  (continue-on-error: true — notifier must survive failures)
# 2. Null gate            (continue-on-error: true — writes gate_failed output)
# 3. Archive/delta/commit (guarded: skip when gate or lhci failed; commit pushes perf-history)
# 4. PR comment           (if: always() + delta succeeded)
# 5. Alert issue          (if: always() — fires on ANY failure, regression, or PIPELINE FAILURE)
# 6. Final fail step      (if: always() — exits 1 after notifications so job is red)
on:
  schedule:
    - cron: '30 0 * * 1' # Monday 00:30 UTC = 06:00 IST
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # continue-on-error so the notification steps below can always run.
      - name: Run Lighthouse CI (${{ matrix.form_factor }})
        id: lhci
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouse/lighthouserc-${{ matrix.form_factor }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      # Belt-and-braces null gate. LHCI's minScore assertion only fires on a
      # numeric value — a null score passes right through. This step writes
      # gate_failed + failure_reason outputs so downstream steps can branch on
      # them. continue-on-error keeps the job alive until the notifier fires.
      - name: Gate — fail if any score is null or collection failed
        id: gate
        continue-on-error: true
        run: |
          set -uo pipefail
          GATE_FAILED=false
          REASON=none
          LHR_COUNT=$(find .lighthouseci -maxdepth 1 -name "lhr-*.json" 2>/dev/null | wc -l)
          if [ "$LHR_COUNT" -eq 0 ]; then
            echo "::error::No LHR files produced — LHCI collection failed entirely for ${{ matrix.form_factor }}. Check Chrome availability on the runner."
            GATE_FAILED=true
            REASON=collection_failed
          else
            FAIL=0
            for f in .lighthouseci/lhr-*.json; do
              NULL_CATS=$(jq -r '[.categories | to_entries[] | select(.value.score == null) | .key] | join(", ")' "$f")
              if [ -n "$NULL_CATS" ]; then
                echo "::error::Null scores in $(basename $f) [${{ matrix.form_factor }}]: $NULL_CATS — monitoring was blind to these categories."
                FAIL=1
                REASON=null_scores
              fi
            done
            if [ "$FAIL" -eq 1 ]; then
              GATE_FAILED=true
            fi
          fi
          echo "gate_failed=$GATE_FAILED" >> "$GITHUB_OUTPUT"
          echo "failure_reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$GATE_FAILED" = "true" ]; then exit 1; fi

      - name: Archive run JSON into lighthouse-history/
        id: archive
        if: steps.lhci.outcome == 'success' && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          STAMP=$(date -u +'%Y-%m-%dT%H-%M-%SZ')
          OUT_DIR=".lighthouseci"
          DEST_DIR="lighthouse-history/${{ matrix.form_factor }}"
          mkdir -p "$DEST_DIR"
          # Lighthouse CI writes one .json per run (we use 3 runs); keep the median.
          MEDIAN=$(ls "$OUT_DIR" | grep -E 'lhr-[0-9]+\.json$' | sort | sed -n '2p')
          if [ -z "$MEDIAN" ]; then
            MEDIAN=$(ls "$OUT_DIR" | grep -E 'lhr-[0-9]+\.json$' | head -n1)
          fi
          cp "$OUT_DIR/$MEDIAN" "$DEST_DIR/${STAMP}.json"
          echo "report_path=$DEST_DIR/${STAMP}.json" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

      - name: Compute score delta vs previous report
        id: delta
        if: steps.lhci.outcome == 'success' && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          FF="${{ matrix.form_factor }}"
          DEST_DIR="lighthouse-history/${FF}"
          NEW="${{ steps.archive.outputs.report_path }}"
          # Read previous report from perf-history branch, not working tree.
          git fetch origin perf-history 2>/dev/null || true
          PREV=""
          PREV_NAME="(no prior report)"
          if git rev-parse --verify "origin/perf-history" >/dev/null 2>&1; then
            _PREV_PATH=$(git ls-tree -r --name-only "origin/perf-history" -- "${DEST_DIR}" 2>/dev/null | grep '\.json$' | sort | tail -n1 || true)
            if [ -n "$_PREV_PATH" ]; then
              git show "origin/perf-history:${_PREV_PATH}" > /tmp/lh-prev-report.json
              PREV="/tmp/lh-prev-report.json"
              PREV_NAME=$(basename "$_PREV_PATH")
            fi
          fi

          # Fixed: use "null" string instead of 0 so callers can detect missing scores.
          read_score() {
            local raw
            raw=$(jq -r ".categories.\"$2\".score" "$1")
            if [ "$raw" = "null" ] || [ -z "$raw" ]; then
              echo "null"
            else
              awk -v v="$raw" 'BEGIN {printf "%d\n", v * 100}'
            fi
          }

          NP=$(read_score "$NEW" performance)
          NA=$(read_score "$NEW" accessibility)
          NB=$(read_score "$NEW" best-practices)
          NS=$(read_score "$NEW" seo)
          if [ -n "$PREV" ]; then
            PP=$(read_score "$PREV" performance)
            PA=$(read_score "$PREV" accessibility)
            PB=$(read_score "$PREV" best-practices)
            PS=$(read_score "$PREV" seo)
            delta_int() {
              if [ "$1" = "null" ] || [ "$2" = "null" ]; then echo "-"; else echo $(( $2 - $1 )); fi
            }
            DP=$(delta_int "$PP" "$NP")
            DA=$(delta_int "$PA" "$NA")
            DB=$(delta_int "$PB" "$NB")
            DS=$(delta_int "$PS" "$NS")
          else
            PP=- ; PA=- ; PB=- ; PS=-
            DP=- ; DA=- ; DB=- ; DS=-
          fi
          {
            echo "form_factor=${{ matrix.form_factor }}"
            echo "perf=$NP"; echo "a11y=$NA"; echo "bp=$NB"; echo "seo=$NS"
            echo "perf_prev=$PP"; echo "a11y_prev=$PA"; echo "bp_prev=$PB"; echo "seo_prev=$PS"
            echo "perf_delta=$DP"; echo "a11y_delta=$DA"; echo "bp_delta=$DB"; echo "seo_delta=$DS"
            echo "prev_name=$PREV_NAME"
          } >> "$GITHUB_OUTPUT"

          # Detect regression: perf drop > 5pts week-over-week, or any score null.
          REG=false
          if [ "$NP" = "null" ]; then REG=true; fi
          if [ "$DP" != "-" ] && [ "$DP" -lt -5 ] 2>/dev/null; then REG=true; fi
          echo "has_regression=$REG" >> "$GITHUB_OUTPUT"

      - name: Commit history JSON
        id: commit_history
        if: steps.lhci.outcome == 'success' && steps.gate.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FF="${{ matrix.form_factor }}"
          STAMP="${{ steps.archive.outputs.stamp }}"
          NEW_FILE="${{ steps.archive.outputs.report_path }}"
          DEST_DIR="lighthouse-history/${FF}"
          # Push history to perf-history branch, never main.
          # Use a git worktree so the source checkout stays untouched.
          WT_DIR=$(mktemp -d)
          cleanup() { git worktree remove --force "$WT_DIR" 2>/dev/null || true; rm -rf "$WT_DIR"; }
          trap cleanup EXIT
          if git ls-remote --exit-code origin perf-history >/dev/null 2>&1; then
            git fetch origin perf-history
            git worktree add "$WT_DIR" origin/perf-history
          else
            git worktree add --orphan -b perf-history "$WT_DIR"
          fi
          mkdir -p "${WT_DIR}/${DEST_DIR}"
          cp "$NEW_FILE" "${WT_DIR}/${NEW_FILE}"
          cd "$WT_DIR"
          git add "lighthouse-history"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(lighthouse): ${FF} report ${STAMP} [skip ci]"
          # Retry on non-fast-forward rejection (mobile + desktop matrix run concurrently).
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/perf-history"; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push rejected (attempt ${attempt}/2) — fetching and rebasing on origin/perf-history..."
              git fetch origin perf-history
              git rebase "origin/perf-history" || { git rebase --abort; echo "Rebase failed — aborting."; exit 1; }
            else
              echo "Push failed after 3 attempts."
              exit 1
            fi
          done

      # Only comment if delta was actually computed (i.e., collection + gate succeeded).
      - name: Comment delta on open PRs
        if: always() && steps.delta.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const ff = '${{ steps.delta.outputs.form_factor }}';
            const cur = {
              perf: '${{ steps.delta.outputs.perf }}',
              a11y: '${{ steps.delta.outputs.a11y }}',
              bp:   '${{ steps.delta.outputs.bp }}',
              seo:  '${{ steps.delta.outputs.seo }}',
            };
            const prev = {
              perf: '${{ steps.delta.outputs.perf_prev }}',
              a11y: '${{ steps.delta.outputs.a11y_prev }}',
              bp:   '${{ steps.delta.outputs.bp_prev }}',
              seo:  '${{ steps.delta.outputs.seo_prev }}',
            };
            const delta = {
              perf: '${{ steps.delta.outputs.perf_delta }}',
              a11y: '${{ steps.delta.outputs.a11y_delta }}',
              bp:   '${{ steps.delta.outputs.bp_delta }}',
              seo:  '${{ steps.delta.outputs.seo_delta }}',
            };
            const fmt = (d) => d === '-' ? '—' : (Number(d) > 0 ? `+${d}` : `${d}`);

            const body = [
              `### Lighthouse weekly (${ff}) — hire.vedryxtech.com`,
              ``,
              `| Category | Previous | Current | Δ |`,
              `|---|---:|---:|---:|`,
              `| Performance | ${prev.perf} | **${cur.perf}** | ${fmt(delta.perf)} |`,
              `| Accessibility | ${prev.a11y} | **${cur.a11y}** | ${fmt(delta.a11y)} |`,
              `| Best practices | ${prev.bp} | **${cur.bp}** | ${fmt(delta.bp)} |`,
              `| SEO | ${prev.seo} | **${cur.seo}** | ${fmt(delta.seo)} |`,
              ``,
              `Vs previous: \`${{ steps.delta.outputs.prev_name }}\`.`,
              `History: [lighthouse-history/${ff}/](../tree/perf-history/lighthouse-history/${ff})`,
            ].join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }

      # Unified alert issue — fires on ANY of: collection failure, null scores,
      # LHCI assertion failure, score regression, or pipeline step failure.
      # Title distinguishes the failure mode so the human knows which response is needed:
      #   "PIPELINE FAILURE"  → archive/delta/commit step failed after collection succeeded
      #   "COLLECTION FAILED" → Chrome runner issue, check Actions runner
      #   "NULL SCORES"       → partial collection, some categories missing
      #   "ASSERT FAILURE"    → score below threshold, investigate perf
      #   "regression"        → >5pt drop week-over-week
      - name: Open alert issue
        if: always() && (steps.lhci.outcome == 'failure' || steps.gate.outcome == 'failure' || steps.archive.outcome == 'failure' || steps.delta.outcome == 'failure' || steps.commit_history.outcome == 'failure' || steps.delta.outputs.has_regression == 'true')
        uses: actions/github-script@v8
        with:
          script: |
            const ff = '${{ matrix.form_factor }}';
            const date = new Date().toISOString().slice(0, 10);
            const lhciOutcome = '${{ steps.lhci.outcome }}';
            const gateOutcome = '${{ steps.gate.outcome }}';
            const failureReason = '${{ steps.gate.outputs.failure_reason }}';
            const archiveOutcome = '${{ steps.archive.outcome }}';
            const deltaOutcome = '${{ steps.delta.outcome }}';
            const commitOutcome = '${{ steps.commit_history.outcome }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            let alertType, intro;
            if (archiveOutcome === 'failure' || deltaOutcome === 'failure' || commitOutcome === 'failure') {
              const failedStep = archiveOutcome === 'failure' ? 'archive' : deltaOutcome === 'failure' ? 'delta' : 'commit_history';
              alertType = 'PIPELINE FAILURE';
              intro = [
                `**Pipeline step failed** — the \`${failedStep}\` step failed for \`${ff}\`.`,
                `LHCI collection succeeded; data may be valid but was not persisted to history.`,
                `**Response:** check the Actions run for the failing step; rerun manually after fix.`,
                `Run: ${runUrl}`,
              ].join('\n');
            } else if (failureReason === 'collection_failed') {
              alertType = 'COLLECTION FAILED';
              intro = [
                `**Collection failed** — no LHR files produced for \`${ff}\`.`,
                `This is a runner/Chrome issue, not a score problem. The site was not measured.`,
                `**Response:** check the Actions run for Chrome startup errors; may need runner or timeout fix.`,
                `Run: ${runUrl}`,
              ].join('\n');
            } else if (failureReason === 'null_scores') {
              alertType = 'NULL SCORES';
              intro = [
                `**Null scores detected** in collected LHRs for \`${ff}\`.`,
                `Partial collection — Chrome ran but some categories returned null. Likely timeout or navigation error.`,
                `**Response:** check the raw LHR in the Actions artifacts; look for runtimeError field.`,
                `Run: ${runUrl}`,
              ].join('\n');
            } else if (lhciOutcome === 'failure') {
              alertType = 'ASSERT FAILURE';
              intro = [
                `**Score below threshold** — LHCI assertion failed for \`${ff}\`.`,
                `At least one category score dropped below the configured minimum.`,
                `**Response:** investigate performance regression in the run artifacts.`,
                `Run: ${runUrl}`,
              ].join('\n');
            } else {
              alertType = 'regression';
              intro = [
                `**Score regression** — performance dropped >5 pts week-over-week for \`${ff}\`.`,
                `Run: ${runUrl}`,
              ].join('\n');
            }

            const title = `Lighthouse ${alertType} [${ff}] — ${date}`;

            const perf = '${{ steps.delta.outputs.perf }}' || 'n/a';
            const a11y = '${{ steps.delta.outputs.a11y }}' || 'n/a';
            const bp   = '${{ steps.delta.outputs.bp }}'   || 'n/a';
            const seo  = '${{ steps.delta.outputs.seo }}'  || 'n/a';
            const perfPrev = '${{ steps.delta.outputs.perf_prev }}' || '-';
            const a11yPrev = '${{ steps.delta.outputs.a11y_prev }}' || '-';
            const bpPrev   = '${{ steps.delta.outputs.bp_prev }}'   || '-';
            const seoPrev  = '${{ steps.delta.outputs.seo_prev }}'  || '-';
            const perfD = '${{ steps.delta.outputs.perf_delta }}' || '-';
            const a11yD = '${{ steps.delta.outputs.a11y_delta }}' || '-';
            const bpD   = '${{ steps.delta.outputs.bp_delta }}'   || '-';
            const seoD  = '${{ steps.delta.outputs.seo_delta }}'  || '-';

            const lines = [
              `### Lighthouse alert — hire.vedryxtech.com (${ff})`,
              ``,
              intro,
              ``,
              `| Category | Previous | Current | Δ |`,
              `|---|---:|---:|---:|`,
              `| Performance | ${perfPrev} | **${perf}** | ${perfD} |`,
              `| Accessibility | ${a11yPrev} | **${a11y}** | ${a11yD} |`,
              `| Best practices | ${bpPrev} | **${bp}** | ${bpD} |`,
              `| SEO | ${seoPrev} | **${seo}** | ${seoD} |`,
              ``,
              `History: [lighthouse-history/${ff}/](../tree/perf-history/lighthouse-history/${ff})`,
            ];
            const body = lines.join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'perf-regression',
              per_page: 20,
            });
            const existing = openIssues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['perf-regression'],
              });
            }

      # Final step — always runs AFTER notifications so the alert destination
      # is confirmed before the job turns red. Exits 1 on any upstream failure.
      - name: Fail job if collection or gate or assertion failed
        if: always()
        run: |
          LHCI_OUTCOME="${{ steps.lhci.outcome }}"
          GATE_OUTCOME="${{ steps.gate.outcome }}"
          ARCHIVE_OUTCOME="${{ steps.archive.outcome }}"
          DELTA_OUTCOME="${{ steps.delta.outcome }}"
          COMMIT_OUTCOME="${{ steps.commit_history.outcome }}"
          if [ "$LHCI_OUTCOME" = "failure" ] || [ "$GATE_OUTCOME" = "failure" ] || \
             [ "$ARCHIVE_OUTCOME" = "failure" ] || [ "$DELTA_OUTCOME" = "failure" ] || \
             [ "$COMMIT_OUTCOME" = "failure" ]; then
            echo "::error::Job failed — lhci: $LHCI_OUTCOME, gate: $GATE_OUTCOME, archive: $ARCHIVE_OUTCOME, delta: $DELTA_OUTCOME, commit: $COMMIT_OUTCOME. Alert issue opened above."
            exit 1
          fi
          echo "All Lighthouse checks passed for ${{ matrix.form_factor }}."
